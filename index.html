<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b0e18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpendIt">

<title>SpendIt — Personal Finance</title>

<style>
:root{
 --bg:#080a12;--bg2:#101426;--card:rgba(255,255,255,.075);--card2:rgba(255,255,255,.11);
 --text:#f7f8ff;--muted:#9ba3bb;--line:rgba(255,255,255,.12);
 --cyan:#59e1ff;--blue:#6685ff;--pink:#ff67c7;--green:#52e0a4;--orange:#ffb45c;--red:#ff6b7a;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
 margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
 color:var(--text);background:
 radial-gradient(circle at 10% 0%,rgba(89,225,255,.13),transparent 30%),
 radial-gradient(circle at 90% 10%,rgba(255,103,199,.12),transparent 28%),
 linear-gradient(135deg,#080a12 0%,#0d1020 55%,#090b14 100%);
 min-height:100vh
}
button,input,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}

/* Liquid glass sidebar */
.sidebar{
 position:fixed;left:18px;top:18px;bottom:18px;width:235px;padding:18px 12px;z-index:20;
 background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035));
 border:1px solid rgba(255,255,255,.14);border-radius:28px;
 backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);
 box-shadow:0 25px 70px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.15)
}
.brand{font-size:25px;font-weight:900;letter-spacing:-1px;padding:8px 13px 25px}
.brand span{background:linear-gradient(90deg,var(--cyan),var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav button{
 width:100%;border:1px solid transparent;background:transparent;text-align:left;padding:12px 13px;
 border-radius:14px;color:#aab1c7;margin:3px 0;font-weight:700;transition:.2s ease
}
.nav button:hover{background:rgba(255,255,255,.075);color:#fff;transform:translateX(3px)}
.nav button.active{
 background:linear-gradient(100deg,rgba(89,225,255,.17),rgba(118,87,255,.2),rgba(255,103,199,.13));
 border-color:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.12),0 8px 25px rgba(0,0,0,.14)
}
.main{margin-left:270px;width:calc(100% - 270px);padding:18px 18px 30px}
.topbar{
 height:70px;background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:22px;
 display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 23px;
 position:sticky;top:18px;z-index:10;backdrop-filter:blur(25px) saturate(160%);-webkit-backdrop-filter:blur(25px) saturate(160%);
 box-shadow:0 18px 45px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.1)
}
.top-title{font-size:17px;font-weight:850}
.top-title:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;background:var(--green);box-shadow:0 0 12px var(--green)}
.top-actions{display:flex;gap:8px}
.btn{
 border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.065);color:#fff;min-height:42px;padding:0 14px;
 border-radius:13px;font-weight:780;backdrop-filter:blur(14px);transition:.18s ease
}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.11)}
.btn.primary{background:linear-gradient(135deg,#5d83ff,#8c5cff 55%,#d05cff);border-color:rgba(255,255,255,.16);box-shadow:0 10px 28px rgba(103,90,255,.3)}
.content{max-width:1500px;margin:auto;padding:27px 8px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
.page-head h1{margin:0;font-size:34px;letter-spacing:-1.5px}
.hint{color:var(--muted);font-size:13px;margin-top:5px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card,.section{
 background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.045));
 border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 45px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.1);
 backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%)
}
.card{border-radius:22px;padding:21px;transition:.2s ease}
.card:hover{transform:translateY(-3px);background:rgba(255,255,255,.105)}
.label{font-size:11px;color:#9ea7bd;font-weight:850;letter-spacing:.7px}
.value{font-size:30px;font-weight:900;margin:9px 0}
.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:15px;margin-top:15px}
.section{border-radius:22px;padding:20px}
.section h2{font-size:17px;margin:0 0 15px}
.empty{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:25px}
.period,input,select{
 height:43px;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:0 11px;
 background:rgba(255,255,255,.065);color:#fff;outline:none;backdrop-filter:blur(14px)
}
select option{background:#171b2b;color:#fff}
input::placeholder{color:#7f879c}
input:focus,select:focus{border-color:rgba(89,225,255,.55);box-shadow:0 0 0 3px rgba(89,225,255,.08)}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 9px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:13px;white-space:nowrap}
th{font-size:10px;color:#8992a8;text-transform:uppercase;letter-spacing:.7px}
.income{color:var(--green);font-weight:850}.expense{color:#fff;font-weight:750}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
label{display:block;font-size:12px;color:#9da6bc;font-weight:750;margin-bottom:5px}
.full{grid-column:1/-1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.dialog{
 background:linear-gradient(145deg,rgba(31,36,58,.97),rgba(15,18,31,.97));border:1px solid rgba(255,255,255,.14);
 width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:26px;padding:23px;
 box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.12)
}
.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.dialog-head h2{margin:0}.close{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font-size:20px}
.mobile-nav{display:none}
.toast{position:fixed;right:20px;bottom:20px;background:rgba(25,28,43,.9);border:1px solid var(--line);color:#fff;padding:13px 17px;border-radius:14px;display:none;z-index:300;backdrop-filter:blur(20px)}
.toast.show{display:block}
.bar-wrap{height:240px;display:flex;align-items:flex-end;gap:12px;padding:20px 8px 30px}
.bar{flex:1;min-height:5px;background:linear-gradient(180deg,var(--cyan),var(--blue));border-radius:10px 10px 4px 4px;position:relative;box-shadow:0 0 24px rgba(89,225,255,.18)}
.bar span{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);font-size:10px;color:#8e97ad;white-space:nowrap}
.statrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.pill{display:inline-block;background:rgba(118,87,255,.15);border:1px solid rgba(118,87,255,.2);color:#c8bcff;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:750}

/* floating mobile liquid glass nav */
@media(max-width:700px){
 .sidebar{display:none}.main{margin-left:0;width:100%;padding:10px 10px 90px}
 .topbar{top:10px;height:65px;border-radius:20px;padding:0 13px}
 .top-actions .btn:first-child{display:none}.content{padding:20px 3px 90px}.page-head{flex-direction:column;align-items:flex-start}
 .cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}
 .section{padding:16px;overflow:auto}
 .mobile-nav{
   position:fixed;display:flex;left:10px;right:10px;bottom:10px;height:67px;padding:6px;
   background:rgba(25,28,43,.72);border:1px solid rgba(255,255,255,.14);border-radius:22px;
   backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
   z-index:20;overflow-x:auto;box-shadow:0 20px 50px rgba(0,0,0,.45)
 }
 .mobile-nav button{min-width:78px;border:0;border-radius:15px;background:transparent;color:#9aa2b8;font-size:10px;font-weight:750}
 .mobile-nav button.active{background:rgba(255,255,255,.1);color:#fff}
}
@media(max-width:470px){.cards{grid-template-columns:1fr}.top-actions .btn{padding:0 9px}.page-head h1{font-size:29px}}
</style>


<style>
body:before,body:after{content:"";position:fixed;width:360px;height:360px;border-radius:50%;filter:blur(80px);opacity:.13;pointer-events:none;z-index:-1}
body:before{background:#59e1ff;left:20%;top:15%;animation:floatA 12s ease-in-out infinite}
body:after{background:#ff67c7;right:8%;bottom:8%;animation:floatB 15s ease-in-out infinite}
@keyframes floatA{50%{transform:translate(80px,60px) scale(1.12)}}
@keyframes floatB{50%{transform:translate(-70px,-50px) scale(.9)}}
</style>

<style>
/* Mobile + laptop responsive enhancements */
html,body{width:100%;overflow-x:hidden}
button,a,select,input{touch-action:manipulation}
@media (max-width: 900px){
  .sidebar{width:205px}
  .main{margin-left:225px;width:calc(100% - 225px)}
  .cards{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
}
@media (max-width: 700px){
  body{padding-bottom:88px}
  .sidebar{display:none}
  .main{margin:0;width:100%;padding:9px 9px 96px}
  .topbar{
    top:9px;height:62px;border-radius:20px;padding:0 11px;
    gap:8px
  }
  .top-title{font-size:15px}
  .top-actions{gap:5px}
  .top-actions .btn{min-height:40px;padding:0 10px;font-size:11px}
  .top-actions .btn:first-child{display:none}
  .content{padding:20px 3px 30px}
  .page-head{gap:12px;margin-bottom:16px}
  .page-head h1{font-size:28px}
  .hint{font-size:12px}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:15px;border-radius:18px;min-width:0}
  .value{font-size:23px;word-break:break-word}
  .label{font-size:10px}
  .grid2{grid-template-columns:1fr;gap:10px;margin-top:10px}
  .section{padding:15px;border-radius:18px}
  .section h2{font-size:15px}
  .period{max-width:180px}
  .form-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  input,select{height:47px;font-size:16px}
  .btn{min-height:45px}
  table{min-width:720px}
  .mobile-nav{
    position:fixed;display:flex;left:9px;right:9px;bottom:9px;height:70px;padding:6px;
    background:rgba(25,28,43,.78);border:1px solid rgba(255,255,255,.16);
    border-radius:23px;backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    z-index:100;overflow-x:auto;box-shadow:0 18px 55px rgba(0,0,0,.48)
  }
  .mobile-nav button{
    flex:0 0 78px;min-width:78px;height:56px;border:0;border-radius:16px;
    background:transparent;color:#9aa2b8;font-size:10px;font-weight:750
  }
  .mobile-nav button.active{
    background:rgba(255,255,255,.11);color:#fff;
    box-shadow:inset 0 1px rgba(255,255,255,.12)
  }
  .modal{padding:10px;align-items:flex-end}
  .dialog{
    width:100%;max-height:92vh;border-radius:26px 26px 18px 18px;
    padding:19px 19px calc(28px + env(safe-area-inset-bottom));margin:0
  }
  .dialog-head{margin-bottom:16px}
  .dialog-head h2{font-size:20px}
}
@media (max-width:430px){
  .cards{grid-template-columns:1fr 1fr}
  .card{padding:13px}
  .value{font-size:20px}
  .top-actions .btn{font-size:10px;padding:0 8px}
  .mobile-nav button{flex-basis:72px;min-width:72px}
}
@media (max-width:360px){
  .cards{grid-template-columns:1fr}
  .top-actions .btn{font-size:9px}
}
</style>

<style>
/* Mobile modal must always sit above the floating navigation bar. */
@media (max-width:700px){
  .modal{z-index:200}
  .modal .dialog{position:relative;z-index:201}
  .toast{z-index:300}
}
</style>

<style>
.mobile-brand{
  display:none;
  font-size:22px;
  font-weight:950;
  letter-spacing:-.8px;
  padding:5px 3px 2px;
}
.mobile-brand span{
  background:linear-gradient(90deg,#59e1ff,#6685ff,#ff67c7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
@media(max-width:700px){
  .mobile-brand{display:block}
}
</style>

<style>
.mobile-top-brand{display:none}
.mobile-top-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
@media(max-width:700px){
  .topbar{height:auto;min-height:104px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;padding:10px 12px 11px;gap:7px}
  .mobile-top-brand{
    display:block;font-size:22px;font-weight:950;letter-spacing:-.8px;line-height:1;
    padding:1px 2px 2px
  }
  .mobile-top-brand span{
    background:linear-gradient(90deg,#59e1ff,#6685ff,#ff67c7);
    -webkit-background-clip:text;background-clip:text;color:transparent
  }
  .mobile-top-row{min-height:42px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
#authScreen{
 position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
 padding:22px;background:
 radial-gradient(circle at 20% 10%,rgba(89,225,255,.16),transparent 35%),
 radial-gradient(circle at 80% 90%,rgba(255,103,199,.14),transparent 38%),
 var(--bg);
}
.auth-card{
 width:min(430px,100%);padding:30px;border:1px solid var(--line);border-radius:28px;
 background:rgba(17,20,38,.78);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
 box-shadow:0 24px 80px rgba(0,0,0,.45);
}
.auth-logo{font-size:34px;font-weight:900;letter-spacing:-1.5px;margin-bottom:8px}
.auth-logo span{background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-sub{color:var(--muted);margin-bottom:24px}
.auth-error{color:#ff9aa5;background:rgba(255,107,122,.1);border:1px solid rgba(255,107,122,.25);padding:10px 12px;border-radius:12px;margin-bottom:12px;display:none}
.auth-status{color:var(--muted);font-size:13px;margin-top:12px;min-height:18px}
.auth-btn{width:100%;margin-top:8px}
.user-chip{font-size:12px;color:var(--muted);padding:7px 10px;border:1px solid var(--line);border-radius:999px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
@media(max-width:700px){.auth-card{padding:24px;border-radius:24px}}
</style>

<style>
/* SpendIt v17: actions-only top bar; dashboard title remains in page content */
.topbar.actions-only{justify-content:flex-end;padding:0 18px}
.topbar.actions-only .top-actions{display:flex;align-items:center;gap:9px}
.dialog textarea{width:100%;box-sizing:border-box;resize:vertical;min-height:82px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:rgba(255,255,255,.04);color:var(--text);font:inherit;outline:none}
.dialog textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(102,133,255,.12)}

 .topbar.actions-only{height:auto;min-height:64px;padding:10px 10px}
 .topbar.actions-only .top-actions{width:100%;justify-content:flex-end;gap:6px}
 .topbar.actions-only .btn{padding:9px 10px;font-size:12px}
}
</style>

<style>
/* v18: restore SpendIt name on mobile without changing the actions-only toolbar */
.mobile-spendit-brand{display:none;font-size:22px;font-weight:950;letter-spacing:-.8px;line-height:1;padding:2px 2px 1px}
.mobile-spendit-brand span{
  background:linear-gradient(90deg,#59e1ff,#6685ff,#ff67c7);
  -webkit-background-clip:text;background-clip:text;color:transparent
}

  .topbar.actions-only{
    min-height:96px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:center;
    gap:8px;
    padding:10px 12px;
  }
  .mobile-spendit-brand{display:block}
  .topbar.actions-only .top-actions{
    width:100%;
    justify-content:flex-start;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .topbar.actions-only .top-actions::-webkit-scrollbar{display:none}
}
</style>


<style>
/* SpendIt V20 polish layer */
.page-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-title h2{margin:0}
.summary-cards{grid-template-columns:repeat(4,1fr)}
.value.negative{color:var(--red)}
.donut-layout{display:grid;grid-template-columns:210px 1fr;align-items:center;gap:22px}.donut{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 45px rgba(102,133,255,.12)}.donut-hole{width:122px;height:122px;border-radius:50%;background:rgba(14,17,30,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.donut-hole strong{font-size:18px}.donut-hole span{font-size:11px;color:var(--muted);margin-top:3px}.legend{display:flex;flex-direction:column;gap:9px}.legend-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}.legend-row span{display:flex;align-items:center;gap:8px}.legend-row i{width:9px;height:9px;border-radius:50%;display:inline-block}
.flow-row{display:grid;grid-template-columns:38px 1fr 82px;gap:9px;align-items:center;margin:13px 0;font-size:11px}.flow-bars{display:flex;flex-direction:column;gap:4px}.flow-bars i{display:block;height:6px;border-radius:99px;min-width:2px}.flow-income{background:var(--green)}.flow-spend{background:var(--pink)}.flow-row small{text-align:right;color:var(--muted)}.flow-legend{display:flex;gap:16px;color:var(--muted);font-size:10px;margin-top:10px}.flow-legend span{display:flex;align-items:center;gap:5px}.flow-legend i{width:10px;height:6px;border-radius:99px;display:inline-block}.account-row,.commit-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.account-row:last-child,.commit-row:last-child{border-bottom:0}.account-row div:first-child,.commit-row div:first-child{display:flex;flex-direction:column;gap:3px}.account-row small,.commit-row small{color:var(--muted);font-size:10px}.account-row div:last-child{display:flex;gap:12px;font-size:11px}.commit-row>strong{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.compact{min-height:120px}
.tx-item{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);border-radius:15px;margin:8px 0;overflow:hidden}.tx-item summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;cursor:pointer}.tx-item summary::-webkit-details-marker{display:none}.tx-item summary:hover{background:rgba(255,255,255,.045)}.tx-main{display:flex;flex-direction:column;gap:4px;min-width:0}.tx-title{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx-meta{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx-amount{font-weight:900;white-space:nowrap}.tx-detail{padding:0 15px 15px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-top:1px solid var(--line)}.tx-detail>div{padding-top:12px}.tx-detail span,.tx-note>span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}.tx-detail strong{font-size:12px}.tx-note{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:2px}.tx-note div{font-size:12px;line-height:1.5;color:var(--text)}
.filter-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:9px;margin-bottom:15px}.quick-title{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}.quick-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.quick-chip{border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);border-radius:999px;padding:8px 11px;font-weight:750;font-size:12px}.quick-chip:hover,.quick-chip.selected{background:rgba(102,133,255,.18);border-color:rgba(102,133,255,.45)}.data-actions{display:flex;gap:9px;flex-wrap:wrap}.theme-row{display:flex;gap:10px}.theme-option{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);padding:12px 16px;border-radius:13px;font-weight:800}.theme-option.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(102,133,255,.12);background:rgba(102,133,255,.14)}.lifetime-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.lifetime-grid>div{padding:12px;border-radius:14px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;gap:5px}.lifetime-grid span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.lifetime-grid strong{font-size:15px}

@media(max-width:700px){.page-tools{width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.page-tools .btn,.page-tools .period{flex:0 0 auto}.summary-cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:3px;scrollbar-width:none}.summary-cards::-webkit-scrollbar{display:none}.summary-cards .card{min-width:74vw;scroll-snap-align:start}.donut-layout{grid-template-columns:1fr;justify-items:center}.donut{width:185px;height:185px}.legend{width:100%}.filter-grid{grid-template-columns:1fr 1fr}.filter-grid input{grid-column:1/-1}.tx-detail{grid-template-columns:1fr 1fr}.lifetime-grid{grid-template-columns:1fr 1fr}.data-actions{flex-direction:column}.data-actions .btn{width:100%}.account-row div:last-child{flex-direction:column;gap:4px;text-align:right}}

<body>

<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">Spend<span>It</span></div>
    <div class="auth-sub">Your private finance dashboard. Sign in to access your synced data.</div>
    <div class="auth-error" id="authError"></div>
    <div>
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="Your email address">
    </div>
    <div style="margin-top:12px">
      <label>Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password">
    </div>
    <button class="btn primary auth-btn" id="loginBtn" onclick="login()">Sign in</button>
    <div class="auth-status" id="authStatus">Your data syncs between your devices after you sign in.</div>
  </div>
</div>

<div class="app">
<aside class="sidebar">
 <div class="brand">Spend<span>It</span></div>
 <nav class="nav" id="nav"></nav>
</aside>
<main class="main">
 <header class="topbar actions-only"><div class="mobile-spendit-brand">Spend<span>It</span></div>
  <div class="top-actions">
    <span class="user-chip" id="userChip" aria-hidden="true" style="display:none"></span>
    <button class="btn" onclick="openCSV()">Import CSV</button>
    <button class="btn" onclick="openIncome()">+ Add income</button>
    <button class="btn primary" onclick="openExpense()">+ Add expense</button>
  </div>
</header>
 <div class="content"><div id="content"></div></div>
</main>
<nav class="mobile-nav" id="mobileNav"></nav>
</div>

<div class="modal" id="modal">
 <div class="dialog">
  <div class="dialog-head"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div>
  <div id="modalBody"></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* SpendIt cloud version: Supabase Auth + Postgres RLS */
const SUPABASE_URL = 'https://rxltvwmeudjycjxvszet.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_-cbC2jJL6mWkZSJc-bKsvw_WvnGel_R';
const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const BANKS=['HDFC','SBI','Punjab'];
const METHODS=['Google Pay','PhonePe','Cash','Account Transfer'];
const CATEGORIES=['Car Loan','Fuel','Chitti','Funds','Groceries','Shopping','Dining','Transportation','Utilities','Subscriptions','Insurance','Health','Entertainment','Income','Other'];

let state = {
  transactions:[],
  categories:[...CATEGORIES],
  banks:[...BANKS],
  paymentMethods:[...METHODS],
  budgets:[],
  goals:[],
  recurring:[],
  subscriptions:[],
  rules:[],
  settings:{assets:0,liabilities:0,netWorthConfigured:false},
  dashboardTotals:{income:0,spending:0}
};
let page='Dashboard';
let selectedMonth=new Date().toISOString().slice(0,7);
applyThemeSafe();
let currentUser=null;
let enteringUserId=null;

function applyThemeSafe(){document.documentElement.classList.toggle('theme-light',localStorage.getItem('spendit_theme')==='light')}
function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.add('open')}
function closeModal(){modal.classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

const navItems=['Dashboard','Transactions','Income','Settings'];
function renderNav(){
  const markup=navItems.map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}')">${x}</button>`).join('');
  nav.innerHTML=markup;mobileNav.innerHTML=markup;
}
function go(p){page=p;renderNav();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
  const fn={Dashboard:dashboard,Transactions:transactions,Income:income,Settings:settings}[page]||dashboard;
  content.innerHTML=fn();
  applyTheme();
}

let selectedPeriod='month';
function periodOptions(){
  const months={};
  state.transactions.forEach(t=>{if(t.date)months[t.date.slice(0,7)]=1});
  const now=new Date();
  months[now.toISOString().slice(0,7)]=1;
  for(let i=1;i<18;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months[d.toISOString().slice(0,7)]=1}
  return Object.keys(months).sort().reverse();
}
function monthLabel(k){
  if(k==='all')return 'All time';
  const [y,m]=k.split('-');
  return new Date(+y,+m-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
}
function selectedKey(){return selectedPeriod==='all'?'all':selectedMonth}
function periodSelect(){
  const opts=[`<option value="all" ${selectedPeriod==='all'?'selected':''}>All time</option>`]
    .concat(periodOptions().map(m=>`<option value="${m}" ${selectedPeriod==='month'&&m===selectedMonth?'selected':''}>${monthLabel(m)}</option>`));
  return `<select class="period" aria-label="Select period" onchange="setSelectedPeriod(this.value)">${opts.join('')}</select>`;
}
function setSelectedPeriod(v){
  if(v==='all'){selectedPeriod='all'}else{selectedPeriod='month';selectedMonth=v}
  render();
}
function periodTransactions(){
  return selectedPeriod==='all' ? [...state.transactions] : state.transactions.filter(t=>t.date&&t.date.slice(0,7)===selectedMonth);
}
function monthlyTransactions(){return periodTransactions().sort((a,b)=>b.date.localeCompare(a.date))}
function totals(arr){
  const income=arr.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const spend=arr.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  return {income,spend,remaining:income-spend,rate:income?((income-spend)/income)*100:0};
}
function periodLabel(){return selectedPeriod==='all'?'All time':monthLabel(selectedMonth)}
function donutStyle(cats){
  const entries=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const total=entries.reduce((s,[,v])=>s+v,0);
  if(!total)return 'conic-gradient(rgba(255,255,255,.08) 0 100%)';
  let cursor=0;const stops=[];
  entries.forEach(([,v],i)=>{const next=cursor+(v/total)*100;stops.push(`${DONUT_COLORS[i%DONUT_COLORS.length]} ${cursor}% ${next}%`);cursor=next});
  return `conic-gradient(${stops.join(',')})`;
}
const DONUT_COLORS=['#59e1ff','#6685ff','#ff67c7','#52e0a4','#ffb45c','#ff6b7a','#a78bfa','#7dd3fc'];
function categoryTotals(arr){
  const cats={};
  arr.filter(x=>x.type==='expense').forEach(x=>cats[x.category||'Other']=(cats[x.category||'Other']||0)+Number(x.amount));
  return cats;
}
function cashFlowData(){
  const now=new Date();
  return Array.from({length:7},(_,idx)=>{
    const d=new Date(now.getFullYear(),now.getMonth()-(6-idx),1),key=d.toISOString().slice(0,7);
    const arr=state.transactions.filter(t=>t.date&&t.date.slice(0,7)===key);
    const t=totals(arr);
    return {key,label:d.toLocaleDateString('en-IN',{month:'short'}),income:t.income,spend:t.spend};
  });
}
function commitmentPatterns(){
  const groups={};
  state.transactions.filter(t=>t.type==='expense'&&t.date).forEach(t=>{
    const key=(t.merchant||t.category||'Other').trim().toLowerCase();
    if(!groups[key])groups[key]={name:t.merchant||t.category||'Other',category:t.category||'Other',months:new Set(),amounts:[]};
    groups[key].months.add(t.date.slice(0,7));groups[key].amounts.push(Number(t.amount)||0);
  });
  return Object.values(groups).filter(g=>g.months.size>=2).map(g=>({...g,avg:g.amounts.reduce((a,b)=>a+b,0)/g.amounts.length})).sort((a,b)=>b.avg-a.avg).slice(0,5);
}
function accountActivity(){
  const period=periodTransactions();
  return BANKS.map(bank=>{
    const arr=period.filter(t=>t.bank===bank);
    const income=arr.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
    const spend=arr.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
    return {bank,income,spend,count:arr.length};
  });
}
function txDetails(t){
  const note=t.notes?`<div class="tx-note"><span>Note</span><div>${esc(t.notes)}</div></div>`:'';
  return `<details class="tx-item" data-search="${esc([t.date,t.merchant,t.category,t.bank,t.paymentMethod,t.notes||'',t.type].join(' ').toLowerCase())}" data-bank="${esc(t.bank||'')}" data-type="${esc(t.type)}" data-category="${esc(t.category||'')}">
    <summary><span class="tx-main"><span class="tx-title">${esc(t.merchant)}</span><span class="tx-meta">${esc(t.date)} · ${esc(t.category||'Other')} · ${esc(t.bank||'—')}</span></span><span class="tx-amount ${t.type}">${t.type==='income'?'+':'−'}${money(t.amount)}</span></summary>
    <div class="tx-detail"><div><span>Category</span><strong>${esc(t.category||'Other')}</strong></div><div><span>Bank</span><strong>${esc(t.bank||'—')}</strong></div><div><span>Payment</span><strong>${esc(t.paymentMethod||'—')}</strong></div><div><span>Type</span><strong>${t.type==='income'?'Income':'Expense'}</strong></div>${note}</div>
  </details>`;
}
function dashboard(){
  const arr=periodTransactions(),t=totals(arr),cats=categoryTotals(arr),entries=Object.entries(cats).sort((a,b)=>b[1]-a[1]),flow=cashFlowData(),accounts=accountActivity(),commitments=commitmentPatterns();
  const nw=state.settings.netWorthConfigured?money(state.settings.assets-state.settings.liabilities):'Not set';
  const lifetime=totals(state.transactions);
  const maxFlow=Math.max(...flow.flatMap(x=>[x.income,x.spend]),1);
  return `<div class="page-head"><div><h1>Your Data</h1><div class="hint">A clearer view of ${esc(periodLabel().toLowerCase())}</div></div><div class="page-tools">${periodSelect()}</div></div>
  <div class="cards summary-cards">
    <div class="card"><div class="label">INCOME</div><div class="value">${money(t.income)}</div><div class="hint">${esc(periodLabel())}</div></div>
    <div class="card"><div class="label">SPENDING</div><div class="value">${money(t.spend)}</div><div class="hint">${esc(periodLabel())}</div></div>
    <div class="card"><div class="label">REMAINING</div><div class="value ${t.remaining<0?'negative':''}">${money(t.remaining)}</div><div class="hint">Income − spending</div></div>
    <div class="card"><div class="label">SAVINGS RATE</div><div class="value">${t.rate.toFixed(1)}%</div><div class="hint">Based on selected period</div></div>
  </div>
  <div class="grid2 dashboard-main">
    <section class="section"><div class="section-title"><h2>Where did my money go?</h2><span class="pill">${money(t.spend)}</span></div>${entries.length?`<div class="donut-layout"><div class="donut" style="background:${donutStyle(cats)}"><div class="donut-hole"><strong>${money(t.spend)}</strong><span>spent</span></div></div><div class="legend">${entries.slice(0,8).map(([k,v],i)=>`<div class="legend-row"><span><i style="background:${DONUT_COLORS[i%DONUT_COLORS.length]}"></i>${esc(k)}</span><strong>${money(v)}</strong></div>`).join('')}</div></div>`:`<div class="empty">No spending data for this period.<br>Add an expense to start your breakdown.</div>`}</section>
    <section class="section"><div class="section-title"><h2>7-month cash flow</h2><span class="hint">Income vs spending</span></div>${flow.map(x=>`<div class="flow-row"><span>${x.label}</span><div class="flow-bars"><i class="flow-income" style="width:${Math.max(2,(x.income/maxFlow)*100)}%"></i><i class="flow-spend" style="width:${Math.max(2,(x.spend/maxFlow)*100)}%"></i></div><small>${money(x.income-x.spend)}</small></div>`).join('')}<div class="flow-legend"><span><i class="flow-income"></i>Income</span><span><i class="flow-spend"></i>Spending</span></div></section>
  </div>
  <div class="grid2 dashboard-secondary">
    <section class="section"><div class="section-title"><h2>Account activity</h2><span class="hint">Transaction-derived</span></div>${accounts.map(a=>`<div class="account-row"><div><strong>${a.bank}</strong><small>${a.count} transaction${a.count===1?'':'s'}</small></div><div><span class="income">+${money(a.income)}</span><span class="expense">−${money(a.spend)}</span></div></div>`).join('')}</section>
    <section class="section"><div class="section-title"><h2>Monthly commitments</h2><span class="hint">Patterns only</span></div>${commitments.length?commitments.map(c=>`<div class="commit-row"><div><strong>${esc(c.name)}</strong><small>${esc(c.category)} · ${c.months.size} months</small></div><strong>${money(c.avg)}<small>avg</small></strong></div>`).join(''):`<div class="empty compact">Recurring patterns will appear after the same payment shows up in at least two months.</div>`}</section>
  </div>
  <section class="section" style="margin-top:16px"><div class="section-title"><h2>Recent activity</h2><span class="hint">Tap any item for details</span></div>${state.transactions.length?[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(txDetails).join(''):`<div class="empty">No transactions yet.</div>`}</section>
  <section class="section lifetime" style="margin-top:16px"><div class="section-title"><h2>Lifetime snapshot</h2><span class="hint">All synced transactions</span></div><div class="lifetime-grid"><div><span>Income</span><strong>${money(lifetime.income)}</strong></div><div><span>Spending</span><strong>${money(lifetime.spend)}</strong></div><div><span>Remaining</span><strong>${money(lifetime.remaining)}</strong></div><div><span>Net worth</span><strong>${nw}</strong></div></div></section>`;
}
function transactions(){
  const arr=monthlyTransactions(),t=totals(arr);
  return `<div class="page-head"><div><h1>Transactions</h1><div class="hint">Search, filter and expand any transaction without editing or deleting it.</div></div><div class="page-tools">${periodSelect()}<button class="btn" onclick="exportCSV(false)">Export CSV</button><button class="btn primary" onclick="openExpense()">+ Add expense</button></div></div>
  <div class="cards summary-cards" style="margin-bottom:16px"><div class="card"><div class="label">INCOME</div><div class="value">${money(t.income)}</div><div class="hint">${esc(periodLabel())}</div></div><div class="card"><div class="label">SPENDING</div><div class="value">${money(t.spend)}</div><div class="hint">${esc(periodLabel())}</div></div><div class="card"><div class="label">TRANSACTIONS</div><div class="value">${arr.length}</div><div class="hint">Selected period</div></div><div class="card"><div class="label">NET FLOW</div><div class="value ${t.remaining<0?'negative':''}">${money(t.remaining)}</div><div class="hint">Income minus spending</div></div></div>
  <section class="section"><div class="filter-grid"><input id="txSearch" placeholder="Search merchant, note, category, bank..." oninput="filterTx()"><select id="txBank" onchange="filterTx()"><option value="">All banks</option>${BANKS.map(b=>`<option>${b}</option>`).join('')}</select><select id="txType" onchange="filterTx()"><option value="">All types</option><option value="expense">Expenses</option><option value="income">Income</option></select><select id="txCategory" onchange="filterTx()"><option value="">All categories</option>${state.categories.filter(c=>c!=='Income').map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
  <div id="txList">${arr.length?arr.map(txDetails).join(''):`<div class="empty">No transactions recorded for ${esc(periodLabel())}.</div>`}</div></section>`;
}
function filterTx(){
  const q=(document.getElementById('txSearch')?.value||'').toLowerCase().trim(),b=document.getElementById('txBank')?.value||'',ty=document.getElementById('txType')?.value||'',c=document.getElementById('txCategory')?.value||'';
  document.querySelectorAll('#txList .tx-item').forEach(el=>{
    const show=(!q||el.dataset.search.includes(q))&&(!b||el.dataset.bank===b)&&(!ty||el.dataset.type===ty)&&(!c||el.dataset.category===c);
    el.style.display=show?'':'none';
  });
}
function income(){
  const arr=state.transactions.filter(t=>t.type==='income'&&(selectedPeriod==='all'||t.date.slice(0,7)===selectedMonth)).sort((a,b)=>b.date.localeCompare(a.date));
  const total=arr.reduce((s,t)=>s+Number(t.amount),0);
  return `<div class="page-head"><div><h1>Income 💚</h1><div class="hint">Track incoming money and where it is stored.</div></div><div class="page-tools">${periodSelect()}<button class="btn primary" onclick="openIncome()">+ Add income</button></div></div><div class="cards summary-cards" style="margin-bottom:16px"><div class="card"><div class="label">INCOME</div><div class="value">${money(total)}</div><div class="hint">${esc(periodLabel())}</div></div><div class="card"><div class="label">ENTRIES</div><div class="value">${arr.length}</div><div class="hint">Incoming transactions</div></div></div><section class="section">${arr.length?arr.map(txDetails).join(''):`<div class="empty">No income for ${esc(periodLabel())}.</div>`}</section>`;
}
function openIncome(){
  openModal('Add income',`<div class="form-grid"><div><label>Amount received</label><input id="iAmount" type="number" min="0" step=".01" autofocus></div><div><label>Date</label><input id="iDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Received from</label><input id="iFrom" placeholder="Salary, Freelance, Dad..."></div><div><label>Bank — where money is stored</label><select id="iBank">${BANKS.map(b=>`<option>${b}</option>`).join('')}</select></div><div><label>Payment method</label><select id="iMethod">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select></div><div><label>Category</label><select id="iCat">${state.categories.map(c=>`<option ${c==='Income'?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="full"><label>Note</label><textarea id="iNotes" rows="3" placeholder="Optional note"></textarea></div><div class="full"><button class="btn primary" onclick="saveIncome()">Save income</button></div></div>`);
}
async function saveIncome(){
  const amount=Number(document.getElementById('iAmount')?.value),from=(document.getElementById('iFrom')?.value||'').trim(),date=document.getElementById('iDate')?.value,bank=document.getElementById('iBank')?.value,method=document.getElementById('iMethod')?.value,category=document.getElementById('iCat')?.value,notes=(document.getElementById('iNotes')?.value||'').trim();
  if(!Number.isFinite(amount)||amount<=0||!from||!date){toast('Complete the required fields');return}
  await insertTransaction({date,merchant:from,category,amount,type:'income',bank,payment_method:method,notes});
}
const QUICK_EXPENSES=[['Fuel','⛽'],['Food','🍔'],['Car Loan','🚗'],['Chitti','🪙'],['Funds','💰'],['Shopping','🛍️']];
function openExpense(){
  openModal('Add expense',`<div class="quick-title">Quick category</div><div class="quick-chips">${QUICK_EXPENSES.map(([c,icon])=>`<button type="button" class="quick-chip" onclick="quickCategory('${esc(c)}')">${icon} ${esc(c)}</button>`).join('')}</div><div class="form-grid"><div><label>Amount spent</label><input id="eAmount" type="number" min="0" step=".01" autofocus></div><div><label>Date</label><input id="eDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Merchant / source</label><input id="eMerchant" placeholder="Swiggy, Amazon, Uber..."></div><div><label>Bank — money spent from</label><select id="eBank">${BANKS.map(b=>`<option>${b}</option>`).join('')}</select></div><div><label>Payment method</label><select id="eMethod">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select></div><div><label>Category</label><select id="eCat">${state.categories.filter(c=>c!=='Income').map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="full"><label>Note</label><textarea id="eNotes" rows="3" placeholder="Optional — e.g. petrol for office commute"></textarea></div><div class="full"><button class="btn primary" onclick="saveExpense()">Save expense</button></div></div>`);
}
function quickCategory(category){const el=document.getElementById('eCat');if(el){el.value=category;el.focus();}document.querySelectorAll('.quick-chip').forEach(b=>b.classList.toggle('selected',b.textContent.includes(category)));}
async function saveExpense(){
  const amount=Number(document.getElementById('eAmount')?.value),merchant=(document.getElementById('eMerchant')?.value||'').trim(),date=document.getElementById('eDate')?.value,bank=document.getElementById('eBank')?.value,method=document.getElementById('eMethod')?.value,category=document.getElementById('eCat')?.value,notes=(document.getElementById('eNotes')?.value||'').trim();
  if(!Number.isFinite(amount)||amount<=0||!merchant||!date){toast('Complete the required fields');return}
  await insertTransaction({date,merchant,category,amount,type:'expense',bank,payment_method:method,notes});
}
function openCSV(){openModal('Import CSV',`<p class="hint">Columns: date, merchant, amount, category, bank, payment_method, notes. Positive amounts are income; negative amounts are expenses.</p><input id="csv" type="file" accept=".csv"><div style="margin-top:15px;text-align:right"><button class="btn primary" onclick="importCSV()">Import</button></div>`)}
function parseCSVLine(line){const out=[];let cur='',quote=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++}else quote=!quote}else if(c===','&&!quote){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out}
async function importCSV(){
  const f=document.getElementById('csv')?.files?.[0];if(!f){toast('Choose a CSV file');return}if(!currentUser){toast('Please sign in first');return}
  const reader=new FileReader();reader.onload=async()=>{const lines=reader.result.split(/\r?\n/).filter(Boolean),head=parseCSVLine(lines.shift()).map(x=>x.toLowerCase()),rows=[];
    for(const line of lines){const c=parseCSVLine(line),get=names=>{const i=head.findIndex(h=>names.includes(h));return i>=0?c[i]:''};const date=get(['date']),merchant=get(['merchant','description','source']),raw=(get(['amount'])||'').replace(/[₹,\s]/g,''),amount=parseFloat(raw);if(!date||!merchant||!Number.isFinite(amount)||amount===0)continue;rows.push({user_id:currentUser.id,date,merchant,category:get(['category'])||'Other',amount:Math.abs(amount),type:amount>0?'income':'expense',bank:get(['bank'])||'HDFC',payment_method:get(['payment_method','payment method','method'])||'Account Transfer',notes:get(['notes'])||null})}
    if(!rows.length){toast('No valid transactions found');return}const {error}=await sb.from('transactions').insert(rows);if(error){console.error(error);toast('Import failed: '+error.message);return}await loadTransactions();closeModal();selectedPeriod='month';selectedMonth=rows[rows.length-1].date.slice(0,7);page='Transactions';renderNav();render();toast(rows.length+' transaction(s) imported')};reader.readAsText(f)
}
function csvEscape(v){const s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
function exportCSV(all=false){
  const arr=all?[...state.transactions]:periodTransactions();
  if(!arr.length){toast('Nothing to export');return}
  const head=['date','merchant','amount','type','category','bank','payment_method','notes'];
  const rows=arr.map(t=>[t.date,t.merchant,t.amount,t.type,t.category,t.bank,t.paymentMethod,t.notes].map(csvEscape).join(','));
  const blob=new Blob([[head.join(','),...rows].join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`spendit-${all?'all-data':selectedPeriod==='all'?'all-time':selectedMonth}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('CSV exported');
}
function backup(){
  const payload={app:'SpendIt',exportedAt:new Date().toISOString(),user:currentUser?.email||null,transactions:state.transactions};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='spendit-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exported');
}
function settings(){
  const theme=localStorage.getItem('spendit_theme')||'dark';
  return `<div class="page-head"><div><h1>Settings</h1><div class="hint">Signed in as ${esc(currentUser?.email||'')}</div></div><button class="btn" onclick="logout()">Sign out</button></div>
  <section class="section"><h2>Appearance</h2><div class="theme-row"><button class="theme-option ${theme==='dark'?'selected':''}" onclick="setTheme('dark')">🌙 Dark</button><button class="theme-option ${theme==='light'?'selected':''}" onclick="setTheme('light')">☀️ Light</button></div></section>
  <section class="section" style="margin-top:16px"><h2>Net worth</h2><p class="hint">Optional manual snapshot. This does not change transaction balances.</p><div class="form-grid"><div><label>Total assets</label><input id="assets" type="number" value="${state.settings.assets}"></div><div><label>Total liabilities</label><input id="liabilities" type="number" value="${state.settings.liabilities}"></div><div><button class="btn primary" onclick="saveNW()">Save net worth</button></div></div></section>
  <section class="section" style="margin-top:16px"><h2>Data & backup</h2><p class="hint">Your transactions remain in Supabase and sync across signed-in devices. Export a local copy whenever you want.</p><div class="data-actions"><button class="btn" onclick="exportCSV(false)">Export selected period CSV</button><button class="btn" onclick="exportCSV(true)">Export all transactions CSV</button><button class="btn primary" onclick="backup()">Download JSON backup</button></div></section>`;
}
function setTheme(theme){localStorage.setItem('spendit_theme',theme);applyTheme();render()}
function applyTheme(){document.documentElement.classList.toggle('theme-light',localStorage.getItem('spendit_theme')==='light')}
function saveNW(){state.settings.assets=+document.getElementById('assets')?.value||0;state.settings.liabilities=+document.getElementById('liabilities')?.value||0;state.settings.netWorthConfigured=true;render();toast('Net worth saved on this device')}

async function insertTransaction(payload){
  if(!currentUser){toast('Please sign in first');return false}
  const row={user_id:currentUser.id,date:payload.date,merchant:payload.merchant,amount:Number(payload.amount),type:payload.type,category:payload.category,bank:payload.bank,payment_method:payload.payment_method,notes:payload.notes||null};
  const {data,error}=await sb.from('transactions').insert(row).select('*').single();
  if(error){console.error('SpendIt insert error:',error);toast('Could not save: '+(error.message||'Database error'));return false}
  await loadDashboardTotals(currentUser);await loadTransactions();await syncNow();closeModal();selectedPeriod='month';selectedMonth=payload.date.slice(0,7);render();toast(payload.type==='income'?'Income added':'Expense added');return !!data;
}

let syncTimer=null;
let syncInProgress=false;

async function syncNow(){
  if(!currentUser||syncInProgress)return;
  syncInProgress=true;
  try{
    // Force a fresh Auth session/user fetch so dashboard totals stored
    // in user metadata are refreshed on every device.
    const {data:authData,error:authError}=await sb.auth.getUser();
    if(authError) throw authError;
    const freshUser=authData?.user;
    if(!freshUser||freshUser.id!==currentUser.id) return;

    currentUser=freshUser;
    const totalsLoaded=await loadDashboardTotals(freshUser);
    const loaded=await loadTransactions(true);
    if(!totalsLoaded) return;
    if(!loaded) return;

    updateSyncUI();
    if(page==='Dashboard'||page==='Transactions'||page==='Income')render();
  }catch(err){
    console.error('SpendIt sync error:',err);
  }finally{
    syncInProgress=false;
  }
}

function startSync(){
  if(syncTimer)clearInterval(syncTimer);
  syncTimer=setInterval(syncNow,10000);
  window.addEventListener('focus',syncNow);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
}

function stopSync(){
  if(syncTimer)clearInterval(syncTimer);
  syncTimer=null;
}

function updateSyncUI(){
  const chip=document.getElementById('userChip');
  if(chip&&currentUser)chip.innerHTML='<span class="sync-dot"></span>Auto-synced';
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if((e.key==='n'||e.key==='N')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA'&&document.activeElement?.tagName!=='SELECT'){e.preventDefault();openExpense()}
  if(e.key==='/'&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA'&&document.activeElement?.tagName!=='SELECT'){const s=document.getElementById('txSearch');if(s){e.preventDefault();s.focus()}}
});
function showAuthError(msg){const el=document.getElementById('authError');el.textContent=msg;el.style.display='block'}
function clearAuthError(){const el=document.getElementById('authError');el.style.display='none';el.textContent=''}
async function login(){
  clearAuthError();
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  if(!email||!password){showAuthError('Enter your email and password.');return}
  const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Signing in...';
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  btn.disabled=false;btn.textContent='Sign in';
  if(error){showAuthError(error.message);return}
  await enterApp(data.user);
}
async function logout(){await sb.auth.signOut()}
async function enterApp(user){
  if(!user)return;
  if(enteringUserId===user.id && currentUser?.id===user.id)return;
  enteringUserId=user.id;
  currentUser=user;
  document.getElementById('authScreen').style.display='none';
  document.getElementById('userChip').innerHTML='<span class="sync-dot"></span>Syncing...';
  await loadDashboardTotals(user);
  await loadTransactions();
  renderNav();render();
  updateSyncUI();
  startSync();
  enteringUserId=null;
}
sb.auth.onAuthStateChange(async(event,session)=>{
  if(session?.user){
    // Avoid doing heavy async work inside the auth callback itself.
    setTimeout(()=>enterApp(session.user),0);
  }else{
    stopSync();
    currentUser=null;
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('loginPassword').value='';
  }
});

(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user) await enterApp(session.user);
  else document.getElementById('authScreen').style.display='flex';
})();
</script>
