<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b0e18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpendIt">

<title>SpendIt — Personal Finance</title>

<style>
:root{
 --bg:#080a12;--bg2:#101426;--card:rgba(255,255,255,.075);--card2:rgba(255,255,255,.11);
 --text:#f7f8ff;--muted:#9ba3bb;--line:rgba(255,255,255,.12);
 --cyan:#59e1ff;--blue:#6685ff;--pink:#ff67c7;--green:#52e0a4;--orange:#ffb45c;--red:#ff6b7a;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
 margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
 color:var(--text);background:
 radial-gradient(circle at 10% 0%,rgba(89,225,255,.13),transparent 30%),
 radial-gradient(circle at 90% 10%,rgba(255,103,199,.12),transparent 28%),
 linear-gradient(135deg,#080a12 0%,#0d1020 55%,#090b14 100%);
 min-height:100vh
}
button,input,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}

/* Liquid glass sidebar */
.sidebar{
 position:fixed;left:18px;top:18px;bottom:18px;width:235px;padding:18px 12px;z-index:20;
 background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035));
 border:1px solid rgba(255,255,255,.14);border-radius:28px;
 backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);
 box-shadow:0 25px 70px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.15)
}
.brand{font-size:25px;font-weight:900;letter-spacing:-1px;padding:8px 13px 25px}
.brand span{background:linear-gradient(90deg,var(--cyan),var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav button{
 width:100%;border:1px solid transparent;background:transparent;text-align:left;padding:12px 13px;
 border-radius:14px;color:#aab1c7;margin:3px 0;font-weight:700;transition:.2s ease
}
.nav button:hover{background:rgba(255,255,255,.075);color:#fff;transform:translateX(3px)}
.nav button.active{
 background:linear-gradient(100deg,rgba(89,225,255,.17),rgba(118,87,255,.2),rgba(255,103,199,.13));
 border-color:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.12),0 8px 25px rgba(0,0,0,.14)
}
.main{margin-left:270px;width:calc(100% - 270px);padding:18px 18px 30px}
.topbar{
 height:70px;background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:22px;
 display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 23px;
 position:sticky;top:18px;z-index:10;backdrop-filter:blur(25px) saturate(160%);-webkit-backdrop-filter:blur(25px) saturate(160%);
 box-shadow:0 18px 45px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.1)
}
.top-title{font-size:17px;font-weight:850}
.top-title:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;background:var(--green);box-shadow:0 0 12px var(--green)}
.top-actions{display:flex;gap:8px}
.btn{
 border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.065);color:#fff;min-height:42px;padding:0 14px;
 border-radius:13px;font-weight:780;backdrop-filter:blur(14px);transition:.18s ease
}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.11)}
.btn.primary{background:linear-gradient(135deg,#5d83ff,#8c5cff 55%,#d05cff);border-color:rgba(255,255,255,.16);box-shadow:0 10px 28px rgba(103,90,255,.3)}
.content{max-width:1500px;margin:auto;padding:27px 8px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
.page-head h1{margin:0;font-size:34px;letter-spacing:-1.5px}
.hint{color:var(--muted);font-size:13px;margin-top:5px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card,.section{
 background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.045));
 border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 45px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.1);
 backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%)
}
.card{border-radius:22px;padding:21px;transition:.2s ease}
.card:hover{transform:translateY(-3px);background:rgba(255,255,255,.105)}
.label{font-size:11px;color:#9ea7bd;font-weight:850;letter-spacing:.7px}
.value{font-size:30px;font-weight:900;margin:9px 0}
.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:15px;margin-top:15px}
.section{border-radius:22px;padding:20px}
.section h2{font-size:17px;margin:0 0 15px}
.empty{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:25px}
.period,input,select{
 height:43px;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:0 11px;
 background:rgba(255,255,255,.065);color:#fff;outline:none;backdrop-filter:blur(14px)
}
select option{background:#171b2b;color:#fff}
input::placeholder{color:#7f879c}
input:focus,select:focus{border-color:rgba(89,225,255,.55);box-shadow:0 0 0 3px rgba(89,225,255,.08)}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 9px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:13px;white-space:nowrap}
th{font-size:10px;color:#8992a8;text-transform:uppercase;letter-spacing:.7px}
.income{color:var(--green);font-weight:850}.expense{color:#fff;font-weight:750}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
label{display:block;font-size:12px;color:#9da6bc;font-weight:750;margin-bottom:5px}
.full{grid-column:1/-1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.dialog{
 background:linear-gradient(145deg,rgba(31,36,58,.97),rgba(15,18,31,.97));border:1px solid rgba(255,255,255,.14);
 width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:26px;padding:23px;
 box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.12)
}
.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.dialog-head h2{margin:0}.close{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font-size:20px}
.mobile-nav{display:none}
.toast{position:fixed;right:20px;bottom:20px;background:rgba(25,28,43,.9);border:1px solid var(--line);color:#fff;padding:13px 17px;border-radius:14px;display:none;z-index:300;backdrop-filter:blur(20px)}
.toast.show{display:block}
.bar-wrap{height:240px;display:flex;align-items:flex-end;gap:12px;padding:20px 8px 30px}
.bar{flex:1;min-height:5px;background:linear-gradient(180deg,var(--cyan),var(--blue));border-radius:10px 10px 4px 4px;position:relative;box-shadow:0 0 24px rgba(89,225,255,.18)}
.bar span{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);font-size:10px;color:#8e97ad;white-space:nowrap}
.statrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.spend-breakdown{display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:center}
.tx-filters{display:grid;grid-template-columns:minmax(220px,1fr) 150px 130px 180px;gap:10px;margin-bottom:8px}
.backup-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.backup-card{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:flex-start}
.backup-card h3{margin:12px 0 7px;font-size:17px}
.backup-card p{color:var(--muted);font-size:13px;line-height:1.5;min-height:58px}
.backup-card .btn{margin-top:auto}
.backup-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;background:rgba(89,225,255,.1);color:var(--cyan);border:1px solid rgba(89,225,255,.2)}
.backup-status{margin-top:18px;padding:14px 16px;border-radius:12px;background:rgba(89,225,255,.05);border:1px solid rgba(89,225,255,.1);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.backup-status span{color:var(--muted);font-size:12px}
@media(max-width:900px){.backup-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.backup-grid{grid-template-columns:1fr}.backup-status{display:block}.backup-status span{display:block;margin-top:5px}}

.tx-search-wrap{position:relative}
.tx-search-wrap input{padding-left:38px}
.tx-search-icon{position:absolute;left:13px;top:50%;transform:translateY(-51%);color:var(--muted);font-size:20px;pointer-events:none}
.tx-filter-hint{font-size:12px;color:var(--muted);margin:0 0 15px}
@media(max-width:900px){.tx-filters{grid-template-columns:1fr 1fr}.tx-search-wrap{grid-column:1/-1}}
@media(max-width:700px){.tx-filters{grid-template-columns:1fr 1fr}.tx-filter-hint{line-height:1.45}}

.spend-donut-wrap{display:flex;align-items:center;justify-content:center;min-height:210px}
.spend-donut{
 width:184px;height:184px;border-radius:50%;position:relative;
 background:conic-gradient(var(--cyan) 0deg 60deg,var(--blue) 60deg 120deg,var(--pink) 120deg 180deg,var(--orange) 180deg 240deg,var(--green) 240deg 300deg,var(--red) 300deg 360deg);
 box-shadow:0 0 30px rgba(89,225,255,.12)
}
.spend-donut::after{content:"";position:absolute;inset:34px;border-radius:50%;background:#151a2b;border:1px solid rgba(255,255,255,.08)}
.spend-donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;text-align:center;pointer-events:none}
.spend-donut-center strong{font-size:17px}.spend-donut-center span{font-size:11px;color:var(--muted);margin-top:4px}
.spend-list{min-width:0}
.spend-row{
 width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;
 padding:10px 0;border:0;border-bottom:1px solid rgba(255,255,255,.08);
 background:transparent;color:var(--text);text-align:left;cursor:pointer
}
.spend-row:hover{background:rgba(255,255,255,.035)}
.spend-row-main{min-width:0}
.spend-row-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.spend-row-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spend-row-top strong{white-space:nowrap}
.spend-track{height:8px;margin-top:7px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.spend-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--blue))}
.spend-row.active{background:rgba(89,225,255,.06)}
.spend-row.active .spend-fill{background:linear-gradient(90deg,var(--pink),var(--blue))}
@media(max-width:700px){
 .spend-breakdown{display:block}
 .spend-donut-wrap{display:none}
 .spend-row{padding:12px 0}
}

.pill{display:inline-block;background:rgba(118,87,255,.15);border:1px solid rgba(118,87,255,.2);color:#c8bcff;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:750}

/* floating mobile liquid glass nav */
@media(max-width:700px){
 .sidebar{display:none}.main{margin-left:0;width:100%;padding:10px 10px 90px}
 .topbar{top:10px;height:65px;border-radius:20px;padding:0 13px}
 .top-actions .btn:first-child{display:none}.content{padding:20px 3px 90px}.page-head{flex-direction:column;align-items:flex-start}
 .cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}
 .section{padding:16px;overflow:auto}
 .mobile-nav{
   position:fixed;display:flex;left:10px;right:10px;bottom:10px;height:67px;padding:6px;
   background:rgba(25,28,43,.72);border:1px solid rgba(255,255,255,.14);border-radius:22px;
   backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
   z-index:20;overflow-x:auto;box-shadow:0 20px 50px rgba(0,0,0,.45)
 }
 .mobile-nav button{min-width:78px;border:0;border-radius:15px;background:transparent;color:#9aa2b8;font-size:10px;font-weight:750}
 .mobile-nav button.active{background:rgba(255,255,255,.1);color:#fff}
}
@media(max-width:470px){.cards{grid-template-columns:1fr}.top-actions .btn{padding:0 9px}.page-head h1{font-size:29px}}
</style>


<style>
body:before,body:after{content:"";position:fixed;width:360px;height:360px;border-radius:50%;filter:blur(80px);opacity:.13;pointer-events:none;z-index:-1}
body:before{background:#59e1ff;left:20%;top:15%;animation:floatA 12s ease-in-out infinite}
body:after{background:#ff67c7;right:8%;bottom:8%;animation:floatB 15s ease-in-out infinite}
@keyframes floatA{50%{transform:translate(80px,60px) scale(1.12)}}
@keyframes floatB{50%{transform:translate(-70px,-50px) scale(.9)}}
</style>

<style>
/* Mobile + laptop responsive enhancements */
html,body{width:100%;overflow-x:hidden}
button,a,select,input{touch-action:manipulation}
@media (max-width: 900px){
  .sidebar{width:205px}
  .main{margin-left:225px;width:calc(100% - 225px)}
  .cards{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
}
@media (max-width: 700px){
  body{padding-bottom:88px}
  .sidebar{display:none}
  .main{margin:0;width:100%;padding:9px 9px 96px}
  .topbar{
    top:9px;height:62px;border-radius:20px;padding:0 11px;
    gap:8px
  }
  .top-title{font-size:15px}
  .top-actions{gap:5px}
  .top-actions .btn{min-height:40px;padding:0 10px;font-size:11px}
  .top-actions .btn:first-child{display:none}
  .content{padding:20px 3px 30px}
  .page-head{gap:12px;margin-bottom:16px}
  .page-head h1{font-size:28px}
  .hint{font-size:12px}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:15px;border-radius:18px;min-width:0}
  .value{font-size:23px;word-break:break-word}
  .label{font-size:10px}
  .grid2{grid-template-columns:1fr;gap:10px;margin-top:10px}
  .section{padding:15px;border-radius:18px}
  .section h2{font-size:15px}
  .period{max-width:180px}
  .form-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  input,select{height:47px;font-size:16px}
  .btn{min-height:45px}
  table{min-width:720px}
  .mobile-nav{
    position:fixed;display:flex;left:9px;right:9px;bottom:9px;height:70px;padding:6px;
    background:rgba(25,28,43,.78);border:1px solid rgba(255,255,255,.16);
    border-radius:23px;backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    z-index:100;overflow-x:auto;box-shadow:0 18px 55px rgba(0,0,0,.48)
  }
  .mobile-nav button{
    flex:0 0 78px;min-width:78px;height:56px;border:0;border-radius:16px;
    background:transparent;color:#9aa2b8;font-size:10px;font-weight:750
  }
  .mobile-nav button.active{
    background:rgba(255,255,255,.11);color:#fff;
    box-shadow:inset 0 1px rgba(255,255,255,.12)
  }
  .modal{padding:10px;align-items:flex-end}
  .dialog{
    width:100%;max-height:92vh;border-radius:26px 26px 18px 18px;
    padding:19px 19px calc(28px + env(safe-area-inset-bottom));margin:0
  }
  .dialog-head{margin-bottom:16px}
  .dialog-head h2{font-size:20px}
}
@media (max-width:430px){
  .cards{grid-template-columns:1fr 1fr}
  .card{padding:13px}
  .value{font-size:20px}
  .top-actions .btn{font-size:10px;padding:0 8px}
  .mobile-nav button{flex-basis:72px;min-width:72px}
}
@media (max-width:360px){
  .cards{grid-template-columns:1fr}
  .top-actions .btn{font-size:9px}
}
</style>

<style>
/* Mobile modal must always sit above the floating navigation bar. */
@media (max-width:700px){
  .modal{z-index:200}
  .modal .dialog{position:relative;z-index:201}
  .toast{z-index:300}
}
</style>

<style>
.mobile-brand{
  display:none;
  font-size:22px;
  font-weight:950;
  letter-spacing:-.8px;
  padding:5px 3px 2px;
}
.mobile-brand span{
  background:linear-gradient(90deg,#59e1ff,#6685ff,#ff67c7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

}
</style>

<style>
.mobile-top-brand{display:none}
.mobile-top-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
@media(max-width:700px){
  .topbar{height:auto;min-height:104px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;padding:10px 12px 11px;gap:7px}
  .mobile-top-brand{
    display:block;font-size:22px;font-weight:950;letter-spacing:-.8px;line-height:1;
    padding:1px 2px 2px
  }
  .mobile-top-brand span{
    background:linear-gradient(90deg,#59e1ff,#6685ff,#ff67c7);

  }

}
</style>

<style>
#authScreen{
 position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
 padding:22px;background:
 radial-gradient(circle at 20% 10%,rgba(89,225,255,.16),transparent 35%),
 radial-gradient(circle at 80% 90%,rgba(255,103,199,.14),transparent 38%),
 var(--bg);
}
.auth-card{
 width:min(430px,100%);padding:30px;border:1px solid var(--line);border-radius:28px;
 background:rgba(17,20,38,.78);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
 box-shadow:0 24px 80px rgba(0,0,0,.45);
}
.auth-logo{font-size:34px;font-weight:900;letter-spacing:-1.5px;margin-bottom:8px}
.auth-logo span{background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-sub{color:var(--muted);margin-bottom:24px}
.auth-error{color:#ff9aa5;background:rgba(255,107,122,.1);border:1px solid rgba(255,107,122,.25);padding:10px 12px;border-radius:12px;margin-bottom:12px;display:none}
.auth-status{color:var(--muted);font-size:13px;margin-top:12px;min-height:18px}
.auth-btn{width:100%;margin-top:8px}
.user-chip{font-size:12px;color:var(--muted);padding:7px 10px;border:1px solid var(--line);border-radius:999px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
@media(max-width:700px){.auth-card{padding:24px;border-radius:24px}}
</style>

<style>

.topbar.actions-only .top-actions{display:flex;align-items:center;gap:9px}
.dialog textarea{width:100%;box-sizing:border-box;resize:vertical;min-height:82px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:rgba(255,255,255,.04);color:var(--text);font:inherit;outline:none}
.dialog textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(102,133,255,.12)}
@media(max-width:700px){
 .topbar.actions-only{height:auto;min-height:64px;padding:10px 10px}
 .topbar.actions-only .top-actions{width:100%;justify-content:flex-end;gap:6px}
 .topbar.actions-only .btn{padding:9px 10px;font-size:12px}
}
</style>

<style>

.mobile-spendit-brand{display:none;font-size:22px;font-weight:950;letter-spacing:-.8px;line-height:1;padding:2px 2px 1px}
.mobile-spendit-brand span{

    flex-direction:column;

  }

    width:100%;

<style>
/* Change 6: separate SpendIt website header + compact action bar */
.sidebar{padding-top:20px}
.topbar.actions-only{
  height:58px;

<script>
/* SpendIt cloud version: Supabase Auth + Postgres RLS */
const SUPABASE_URL = 'https://rxltvwmeudjycjxvszet.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_-cbC2jJL6mWkZSJc-bKsvw_WvnGel_R';
const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const BANKS=['HDFC','SBI','Punjab'];
const METHODS=['Google Pay','PhonePe','Cash','Account Transfer'];
const CATEGORIES=['Car Loan','Fuel','Chitti','Funds','Groceries','Shopping','Dining','Transportation','Utilities','Subscriptions','Insurance','Health','Entertainment','Income','Other'];

let state = {
  transactions:[],
  categories:[...CATEGORIES],
  banks:[...BANKS],
  paymentMethods:[...METHODS],
  budgets:[],
  goals:[],
  recurring:[],
  subscriptions:[],
  rules:[],
  settings:{assets:0,liabilities:0,netWorthConfigured:false},
  dashboardTotals:{income:0,spending:0}
};
let page='Dashboard';
let selectedMonth=new Date().toISOString().slice(0,7);
let currentUser=null;
let enteringUserId=null;

function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.add('open')}
function closeModal(){modal.classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

const navItems=['Dashboard','Transactions','Income','Backup & Export','Settings'];
function renderNav(){
  const markup=navItems.map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}')">${x}</button>`).join('');
  nav.innerHTML=markup;mobileNav.innerHTML=markup;
}
function go(p){page=p;renderNav();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
  const fn={Dashboard:dashboard,Transactions:transactions,Income:income,'Backup & Export':backupExport,Recurring:recurring,Subscriptions:subscriptions,Budgets:budgets,Goals:goals,Documents:documents,Rules:rules,Settings:settings}[page];
  content.innerHTML=fn();
}
function periodOptions(){
  const months={};
  state.transactions.forEach(t=>{if(t.date&&/^\d{4}-\d{2}/.test(t.date))months[t.date.slice(0,7)]=1});
  const now=new Date();
  const currentKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  months[currentKey]=1;
  for(let i=1;i<12;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;months[key]=1}
  const list=Object.keys(months).sort().reverse();
  return ['all',...list];
}
function monthLabel(k){
  if(k==='all')return 'All time';
  const [y,m]=k.split('-');
  return new Date(+y,+m-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
}
function monthSelect(){return `<select class="period" aria-label="Select period" onchange="selectedMonth=this.value;render()">${periodOptions().map(m=>`<option value="${m}" ${m===selectedMonth?'selected':''}>${monthLabel(m)}</option>`).join('')}</select>`}
function monthlyTransactions(){
  return state.transactions.filter(t=>t.date&&(selectedMonth==='all'||t.date.slice(0,7)===selectedMonth)).sort((a,b)=>b.date.localeCompare(a.date));
}
function totals(arr){const income=arr.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0),spend=arr.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);return {income,spend,rate:income?((income-spend)/income)*100:0}}


function focusSpendCat(btn){
  document.querySelectorAll('.spend-row').forEach(x=>x.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

function dashboard(){
  const arr=monthlyTransactions();
  const t=totals(arr);
  const periodName=monthLabel(selectedMonth);
  const recent=arr.slice(0,5);

  // Category breakdown is always derived from the currently selected period.
  const cats={};
  arr.filter(x=>x.type==='expense').forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount));
  const catEntries=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const max=Math.max(...catEntries.map(([,v])=>v),1);

  // Seven-point cash-flow chart. For a selected month, show daily flow for that
  // month; for All time, show the latest seven months.
  const cashPoints=[];
  if(selectedMonth==='all'){
    const monthMap={};
    state.transactions.forEach(x=>{if(!x.date)return;const k=x.date.slice(0,7);if(!monthMap[k])monthMap[k]={income:0,spend:0};if(x.type==='income')monthMap[k].income+=Number(x.amount);else if(x.type==='expense')monthMap[k].spend+=Number(x.amount)});
    Object.keys(monthMap).sort().slice(-7).forEach(k=>cashPoints.push({label:monthLabel(k).split(' ')[0].slice(0,3),income:monthMap[k].income,spend:monthMap[k].spend}));
  }else{
    const dayMap={};
    arr.forEach(x=>{if(!dayMap[x.date])dayMap[x.date]={income:0,spend:0};if(x.type==='income')dayMap[x.date].income+=Number(x.amount);else if(x.type==='expense')dayMap[x.date].spend+=Number(x.amount)});
    Object.keys(dayMap).sort().slice(-7).forEach(k=>cashPoints.push({label:k.slice(8,10),income:dayMap[k].income,spend:dayMap[k].spend}));
  }
  const cashMax=Math.max(...cashPoints.map(p=>p.income+p.spend),1);

  return `<div class="page-head">
    <div><h1>Your Data</h1><div class="hint">Private cloud-synced money snapshot</div></div>
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">${monthSelect()}</div>
  </div>

  <section class="section" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div><div class="label">SELECTED PERIOD</div><h2 style="margin:4px 0 0">${periodName}</h2></div>
      <div class="hint" style="font-weight:600">Income − Spending = Remaining</div>
    </div>
    <div class="cards" style="margin-top:14px">
      <div class="card"><div class="label">💰 INCOME</div><div class="value">${money(t.income)}</div><div class="hint">${periodName}</div></div>
      <div class="card"><div class="label">💸 SPENDING</div><div class="value">${money(t.spend)}</div><div class="hint">${periodName}</div></div>
      <div class="card"><div class="label">💚 REMAINING</div><div class="value">${money(t.income-t.spend)}</div><div class="hint">Income − Spending</div></div>
      <div class="card"><div class="label">SAVINGS RATE</div><div class="value">${t.rate.toFixed(1)}%</div><div class="hint">For ${periodName}</div></div>
    </div>
  </section>

  <div class="grid2">
    <section class="section"><h2>Cash flow</h2>${cashPoints.length?`<div class="bar-wrap">${cashPoints.map(p=>`<div class="bar" style="height:${Math.max(7,((p.income+p.spend)/cashMax)*175)}px"><span>${esc(p.label)}</span></div>`).join('')}</div><div class="hint" style="margin-top:4px">Income and spending activity for the selected period.</div>`:`<div class="empty">No transaction data for ${esc(periodName)}.</div>`}</section>
    <section class="section">
      <h2>Where did my money go?</h2>
      ${catEntries.length?(() => {
        const topCats=catEntries.slice(0,8);
        const palette=['var(--cyan)','var(--blue)','var(--pink)','var(--orange)','var(--green)','var(--red)'];
        let angle=0;
        const stops=topCats.map(([k,v],i)=>{
          const next=angle+(v/t.spend)*360;
          const stop=`${palette[i%palette.length]} ${angle}deg ${next}deg`;
          angle=next;
          return stop;
        }).join(',');
        const donut=`conic-gradient(${stops})`;
        return `<div class="spend-breakdown">
          <div class="spend-donut-wrap">
            <div class="spend-donut" style="background:${donut}" aria-label="Spending breakdown donut chart">
              <div class="spend-donut-center"><strong>${money(t.spend)}</strong><span>${esc(periodName)}</span></div>
            </div>
          </div>
          <div class="spend-list">
            ${topCats.map(([k,v],i)=>`<button type="button" class="spend-row" onmouseenter="focusSpendCat(this)" onfocus="focusSpendCat(this)" onclick="focusSpendCat(this)" aria-label="${esc(k)} ${money(v)}">
              <div class="spend-row-main">
                <div class="spend-row-top"><span>${esc(k)}</span><strong>${money(v)}</strong></div>
                <div class="spend-track"><div class="spend-fill" style="width:${Math.max(2,(v/max)*100)}%;background:${palette[i%palette.length]}"></div></div>
              </div>
            </button>`).join('')}
          </div>
        </div>`;
      })():`<div class="empty">No spending data for ${esc(periodName)}.</div>`}
    </section>
  </div>

  <section class="section" style="margin-top:16px"><h2>Recent activity</h2>${recent.length?`<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Source / Merchant</th><th>Category</th><th>Bank</th><th>Payment method</th><th>Amount</th><th></th></tr></thead><tbody>${recent.map(txRow).join('')}</tbody></table></div>`:`<div class="empty">No transactions recorded for ${esc(periodName)}. Use <b style="margin:0 4px">+ Add income</b> or <b style="margin-left:4px">+ Add expense</b>.</div>`}</section>`;
}

function txRow(t){
  const sign=t.type==='income'?'+':'−';
  return `<tr><td>${esc(t.date)}</td><td>${esc(t.merchant)}</td><td>${esc(t.category)}</td><td>${esc(t.bank||'—')}</td><td>${esc(t.paymentMethod||'—')}</td><td class="${t.type}">${sign}${money(t.amount)}</td><td></td></tr>`;
}

function transactions(){
  const arr=monthlyTransactions(),t=totals(arr);
  return `<div class="page-head"><div><h1>Transactions</h1><div class="hint">Complete transaction history for the selected period.</div></div><div style="display:flex;gap:9px;align-items:center">${monthSelect()}<button class="btn primary" onclick="openExpense()">+ Add expense</button></div></div>
  <div class="cards" style="margin-bottom:16px">
   <div class="card"><div class="label">MONTH INCOME</div><div class="value">${money(t.income)}</div><div class="hint">${monthLabel(selectedMonth)}</div></div>
   <div class="card"><div class="label">MONTH SPENDING</div><div class="value">${money(t.spend)}</div><div class="hint">${monthLabel(selectedMonth)}</div></div>
   <div class="card"><div class="label">TRANSACTION COUNT</div><div class="value">${arr.length}</div><div class="hint">All entries this month</div></div>
   <div class="card"><div class="label">NET FLOW</div><div class="value">${money(t.income-t.spend)}</div><div class="hint">Income minus spending</div></div>
  </div>
  <section class="section">
   <div class="tx-filters">
    <div class="tx-search-wrap"><span class="tx-search-icon">⌕</span><input id="txSearch" placeholder="Search transactions" autocomplete="off" oninput="filterTx()" aria-label="Search transactions"></div>
    <select id="txBank" onchange="filterTx()" aria-label="Filter by bank"><option value="">All banks</option>${BANKS.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('')}</select>
    <select id="txType" onchange="filterTx()" aria-label="Filter by type"><option value="">All</option><option value="income">Income</option><option value="expense">Expense</option></select>
    <select id="txCategory" onchange="filterTx()" aria-label="Filter by category"><option value="">All categories</option>${state.categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>
   </div>
   <div class="tx-filter-hint">Search by merchant, category, bank or payment method. Use the filters to narrow your results.</div>
   <div style="overflow:auto"><table id="txTable"><thead><tr><th>Date</th><th>Source / Merchant</th><th>Category</th><th>Bank</th><th>Payment method</th><th>Amount</th><th></th></tr></thead><tbody>${arr.map(txRow).join('')}</tbody></table></div>
   ${!arr.length?`<div class="empty">No transactions recorded for ${monthLabel(selectedMonth)}.</div>`:''}
  </section>`;
}
function filterTx(){
  const q=(document.getElementById('txSearch')?.value||'').trim().toLowerCase();
  const bank=document.getElementById('txBank')?.value||'';
  const type=document.getElementById('txType')?.value||'';
  const category=document.getElementById('txCategory')?.value||'';
  document.querySelectorAll('#txTable tbody tr').forEach(r=>{
    const text=r.textContent.toLowerCase();
    const matchesSearch=!q||text.includes(q);
    const matchesBank=!bank||r.children[3]?.textContent.trim()===bank;
    const matchesType=!type||r.querySelector('.income,.expense')?.classList.contains(type);
    const matchesCategory=!category||r.children[2]?.textContent.trim()===category;
    r.style.display=(matchesSearch&&matchesBank&&matchesType&&matchesCategory)?'':'none';
  });
}

function income(){
  const arr=state.transactions.filter(t=>t.type==='income'&&t.date&&(selectedMonth==='all'||t.date.slice(0,7)===selectedMonth));
  return `<div class="page-head"><div><h1>Income 💚</h1><div class="hint">Track incoming money and exactly where it is stored.</div></div><div style="display:flex;gap:9px;align-items:center">${monthSelect()}<button class="btn primary" onclick="openIncome()">+ Add income</button></div></div>
  <section class="section"><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Received from</th><th>Bank</th><th>Payment method</th><th>Category</th><th>Amount</th><th></th></tr></thead><tbody>${arr.map(txRow).join('')}</tbody></table></div>${!arr.length?`<div class="empty">No income for ${monthLabel(selectedMonth)}.</div>`:''}</section>`;
}

function openIncome(){
  openModal('Add income',`<div class="form-grid">
  <div><label>Amount received</label><input id="iAmount" type="number" min="0" step=".01"></div>
  <div><label>Date</label><input id="iDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
  <div><label>Received from</label><input id="iFrom" placeholder="Dad, Sister, Salary, Freelance"></div>
  <div><label>Bank — where money is stored</label><select id="iBank">${BANKS.map(b=>`<option>${b}</option>`).join('')}</select></div>

async function loadDashboardTotals(user){
  if(!user?.id)return false;
  const {data,error}=await sb.from('dashboard_totals')
    .select('total_income,total_spending')
    .eq('user_id',user.id)
    .maybeSingle();
  if(error){
    console.error('SpendIt dashboard totals load error:',error);
    toast('Dashboard totals sync error: '+error.message);
    return false;
  }
  if(data){
    state.dashboardTotals={
      income:Number(data.total_income)||0,
      spending:Number(data.total_spending)||0
    };
    return true;
  }

  // One-time migration of the old metadata totals into the dedicated table.
  const meta=user.user_metadata||{};
  const income=Number(meta.spendit_total_income)||0;
  const spending=Number(meta.spendit_total_spending)||0;
  const {data:seed,error:seedError}=await sb.from('dashboard_totals')
    .upsert({user_id:user.id,total_income:income,total_spending:spending},{onConflict:'user_id'})
    .select('total_income,total_spending')
    .single();
  if(seedError){
    console.error('SpendIt dashboard totals seed error:',seedError);
    toast('Could not initialize dashboard totals: '+seedError.message);
    return false;
  }
  state.dashboardTotals={
    income:Number(seed.total_income)||0,
    spending:Number(seed.total_spending)||0
  };
  return true;
}

async function insertTransaction(payload){
  if(!currentUser){toast('Please sign in first');return false}
  const row={
    user_id:currentUser.id,
    date:payload.date,
    merchant:payload.merchant,
    amount:Number(payload.amount),
    type:payload.type,
    category:payload.category,
    bank:payload.bank,
    payment_method:payload.payment_method,
    notes:payload.notes||null
  };
  const {data,error}=await sb.from('transactions').insert(row).select('*').single();
  if(error){
    console.error('SpendIt insert error:',error);
    toast('Could not save: '+(error.message||'Database error'));
    return false;
  }
  // The database trigger updates dashboard_totals atomically when this
  // transaction is inserted. Do not increment the local totals here.
  await loadDashboardTotals(currentUser);
  await loadTransactions();
  await syncNow();
  closeModal();selectedMonth=payload.date.slice(0,7);render();
  toast(payload.type==='income'?'Income added':'Expense added');
  return !!data;
}

    if(!silent)toast('Could not load your data: '+(error.message||'Database error'));

  state.transactions=(data||[]).map(r=>({
    id:r.id,date:r.date,merchant:r.merchant,amount:Number(r.amount),type:r.type,category:r.category,
    bank:r.bank,paymentMethod:r.payment_method,notes:r.notes,created_at:r.created_at,user_id:r.user_id

function parseCSVLine(line){const out=[];let cur='',quote=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++}else quote=!quote}else if(c===','&&!quote){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out}

async function importCSV(){
  const f=csv.files[0];if(!f){toast('Choose a CSV file');return}
  if(!currentUser){toast('Please sign in first');return}
  const reader=new FileReader();
  reader.onload=async()=>{
    const lines=reader.result.split(/\r?\n/).filter(Boolean),head=parseCSVLine(lines.shift()).map(x=>x.toLowerCase());
    const rows=[];
    for(const line of lines){
      const c=parseCSVLine(line),get=(names)=>{const i=head.findIndex(h=>names.includes(h));return i>=0?c[i]:''};
      const date=get(['date']),merchant=get(['merchant','description','source']),raw=(get(['amount'])||'').replace(/[₹,\s]/g,''),amount=parseFloat(raw);
      if(!date||!merchant||!Number.isFinite(amount)||amount===0)continue;
      rows.push({
        user_id:currentUser.id,date,merchant,category:get(['category'])||'Needs review',
        amount:Math.abs(amount),type:amount>0?'income':'expense',
        bank:get(['bank'])||'HDFC',payment_method:get(['payment_method','payment method','method'])||'Account Transfer',
        notes:get(['notes'])||null
      });
    }
    if(!rows.length){toast('No valid transactions found');return}
    const {error}=await sb.from('transactions').insert(rows);
    if(error){console.error(error);toast('Import failed: '+error.message);return}
    await loadTransactions();closeModal();page='Transactions';renderNav();render();
    toast(rows.length+' transaction(s) imported');
  };
  reader.readAsText(f);
}

function downloadBlob(content,filename,type){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvCell(v){
  const s=String(v??'');
  return `"${s.replace(/"/g,'""')}"`;
}
function transactionsCsv(arr){
  const headers=['Date','Type','Amount','Category','Source / Merchant','Bank','Payment Method','Note'];
  const rows=arr.map(t=>[
    t.date,t.type,Number(t.amount)||0,t.category,t.merchant,t.bank,t.paymentMethod,t.note||''
  ]);
  return [headers,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n');
}

function lastBackupLabel(){
  const raw=localStorage.getItem('spendit_last_backup');

  const d=new Date(raw);

let syncTimer=null;
let syncInProgress=false;

async function syncNow(){
  if(!currentUser||syncInProgress)return;
  syncInProgress=true;
  try{
    // Force a fresh Auth session/user fetch so dashboard totals stored
    // in user metadata are refreshed on every device.
    const {data:authData,error:authError}=await sb.auth.getUser();
    if(authError) throw authError;
    const freshUser=authData?.user;
    if(!freshUser||freshUser.id!==currentUser.id) return;

    currentUser=freshUser;
    const totalsLoaded=await loadDashboardTotals(freshUser);
    const loaded=await loadTransactions(true);
    if(!totalsLoaded) return;
    if(!loaded) return;

    updateSyncUI();
    if(page==='Dashboard'||page==='Transactions'||page==='Income')render();
  }catch(err){
    console.error('SpendIt sync error:',err);
  }finally{
    syncInProgress=false;
  }
}

function startSync(){
  if(syncTimer)clearInterval(syncTimer);
  syncTimer=setInterval(syncNow,10000);
  window.addEventListener('focus',syncNow);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
}

function stopSync(){
  if(syncTimer)clearInterval(syncTimer);
  syncTimer=null;
}

function updateSyncUI(){
  const chip=document.getElementById('userChip');
  if(chip&&currentUser)chip.innerHTML='<span class="sync-dot"></span>Auto-synced';
}

function showAuthError(msg){const el=document.getElementById('authError');el.textContent=msg;el.style.display='block'}
function clearAuthError(){const el=document.getElementById('authError');el.style.display='none';el.textContent=''}
async function login(){
  clearAuthError();
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  if(!email||!password){showAuthError('Enter your email and password.');return}
  const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Signing in...';
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  btn.disabled=false;btn.textContent='Sign in';
  if(error){showAuthError(error.message);return}
  await enterApp(data.user);
}
async function logout(){await sb.auth.signOut()}
async function enterApp(user){
  if(!user)return;
  if(enteringUserId===user.id && currentUser?.id===user.id)return;
  enteringUserId=user.id;
  currentUser=user;
  document.getElementById('authScreen').style.display='none';
  document.getElementById('userChip').innerHTML='<span class="sync-dot"></span>Syncing...';
  await loadDashboardTotals(user);
  await loadTransactions();
  renderNav();render();
  updateSyncUI();
  startSync();
  enteringUserId=null;
}
sb.auth.onAuthStateChange(async(event,session)=>{
  if(session?.user){
    // Avoid doing heavy async work inside the auth callback itself.
    setTimeout(()=>enterApp(session.user),0);
  }else{
    stopSync();
    currentUser=null;
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('loginPassword').value='';
  }
});

(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user) await enterApp(session.user);
  else document.getElementById('authScreen').style.display='flex';
})();
</script>
